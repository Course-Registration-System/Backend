# 로컬 개발용 MySQL. `docker compose up -d` 로 실행합니다.
services:
  mysql:
    image: mysql:8.4
    container_name: crs-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crs
      MYSQL_USER: crs
      MYSQL_PASSWORD: crs
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
