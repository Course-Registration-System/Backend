spring:
  application:
    name: backend
  # 프로필을 지정하지 않으면 demo: 시연 API(/api/dev/*)가 켜진다. 운영은 SPRING_PROFILES_ACTIVE 로 다른 프로필을 준다.
  profiles:
    default: demo
  # 프로젝트 루트의 .env 를 설정값으로 읽습니다. 없으면 건너뜁니다(환경 변수로 넘겨도 됩니다).
  config:
    import: optional:file:.env[.properties]
  # 런타임 계정 app: 데이터 조회·추가·수정만 합니다(DDL 없음).
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:crs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: app
    password: ${APP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 스키마 계정 migrator: 시작할 때 db/migration 의 V*·R* 파일과 db/seed 의 시드를 적용합니다.
  flyway:
    user: migrator
    password: ${MIGRATOR_DB_PASSWORD}
    locations: classpath:db/migration,classpath:db/seed
  # 강의계획서 PDF 업로드(LEC-03) 크기 한도. 넘으면 413 PLAN_FILE_TOO_LARGE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 업로드 한도(11MB)를 넘어 거절한 요청도 본문을 끝까지 읽고 413 을 보낸다. 기본값(2MB)이면 연결을 끊어 클라이언트가 413 을 못 받는다
    max-swallow-size: 12MB

crs:
  clock:
    # 서버 시작 시 앱의 현재 시각. 기본값은 시드 기준 시각 T0. 비우면 실제 시각을 씁니다. 시점 목록은 docs/seed-data.md
    fixed-at: ${CLOCK_FIXED_AT:2026-12-21T10:00:00}
  plan:
    # 강의계획서 PDF 를 두는 폴더(LEC-03). 그 아래 plans/{학기번호}/{과목코드}-{분반}.pdf 로 저장하고 DB 에는 상대 경로만 둡니다
    dir: ${PLAN_DIR:./data}
  jwt:
    # 토큰 서명 키. base64 로 32바이트 이상(.env 의 JWT_SECRET)
    secret: ${JWT_SECRET}
    # 수강신청(10~15시)을 한 번 로그인으로 마칠 수 있는 길이
    valid-hours: 6
