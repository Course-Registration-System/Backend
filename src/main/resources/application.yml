spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:crs}
    password: ${DB_PASSWORD:crs}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}
